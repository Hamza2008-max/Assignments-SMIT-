<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-soft">
    <div class="container py-5">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-lg-6">
                <div class="card auth-card shadow-lg position-relative">
                    <div class="row g-0">
                        <div class="col-md-5 auth-side text-white p-5 d-flex flex-column justify-content-center">
                            <div>
                                <div class="d-flex align-items-center gap-2 mb-3">
                                    <img src="logo.svg" class="dashboard-logo" alt="Logo" />
                                    <h1 class="h5 mb-0">Student Portal</h1>
                                </div>
                                <p class="lead text-white-75 mb-4">Secure Access For Administrators To Review Attendance
                                    And Student Details.</p>
                                <div class="badge bg-white text-primary mb-3">Credentials</div>
                                <p class="mb-1"><strong>User:</strong> Admin</p>
                                <p class="mb-0"><strong>Password:</strong> 1234</p>
                            </div>
                        </div>
                        <div class="col-md-7 p-5">
                            <div class="mb-4 text-center">
                                <h2 class="fw-bold">Welcome Back</h2>
                                <p class="text-muted mb-0">Sign In To Open The Student Dashboard.</p>
                            </div>

                            <form action="dashboard.html" method="get" class="login-form">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Username</label>
                                    <input type="text" class="form-control form-control-lg" id="username"
                                        name="username" placeholder="Enter Username" required />
                                </div>
                                <div class="mb-4">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control form-control-lg" id="password"
                                        name="password" placeholder="Enter Password" required />
                                </div>
                                <button type="submit" class="btn btn-primary btn-lg w-100">Sign In</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
